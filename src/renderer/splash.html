<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>启动中</title>
<script>
  /*
   * Pick the palette BEFORE the stylesheet is parsed.
   *
   * The splash mirrors the theme the app is about to show: a dark card in front of a white
   * workspace (or the reverse) reads as a bug. Main passes ?theme=, and the system preference
   * is only a fallback for the case where the query is missing.
   *
   * Synchronous and inline on purpose: a deferred script would let the first frame paint in
   * the wrong palette, which is exactly the flash this page exists to prevent.
   */
  ;(function () {
    var match = /[?&]theme=(light|dark)/.exec(window.location.search)
    var theme = match ? match[1] : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    document.documentElement.setAttribute('data-theme', theme)
  })()
</script>
<style>
/*
 * Two palettes, one stylesheet.
 *
 * Everything that differs between light and dark is a custom property, so the layout and
 * the motion below are written once. Dark is the default so a script failure cannot leave
 * a white card on a dark workspace.
 */
:root,
:root[data-theme="dark"] {
  --bg-a: #16202f;
  --bg-b: #0b0e14;
  --text: #e6edf6;
  --muted: #8b98ab;
  --accent: #4c8dff;
  --halo: rgba(76, 141, 255, 0.6);
  --logo-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 18px 40px -16px rgba(76, 141, 255, 0.75);
  --bar-track: rgba(255, 255, 255, 0.07);
  --edge: none;
}
:root[data-theme="light"] {
  --bg-a: #eef3fc;
  --bg-b: #ffffff;
  --text: #203858;
  --muted: #74839a;
  --accent: #4c72f2;
  --halo: rgba(76, 114, 242, 0.5);
  --logo-shadow: 0 0 0 1px rgba(32, 56, 88, 0.06), 0 18px 40px -18px rgba(76, 114, 242, 0.6);
  --bar-track: rgba(32, 56, 88, 0.08);
  /*
   * A white card on a white desktop has no edge. Transparent windows cannot cast a shadow
   * outside their own bounds (the shadow is clipped), so the border has to be drawn INSIDE
   * the card. That is the only reliable way to keep it visible.
   */
  --edge: inset 0 0 0 1px rgba(32, 56, 88, 0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  border-radius: 16px;
  background: radial-gradient(120% 90% at 50% -10%, var(--bg-a) 0%, var(--bg-b) 55%), var(--bg-b);
  box-shadow: var(--edge);
  color: var(--text);
  font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-app-region: drag;
  opacity: 1;
  transition: opacity 0.3s ease;
}
.stage { position: relative; width: 104px; height: 104px; display: grid; place-items: center; margin-bottom: 26px; }
.halo {
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(0, 0, 0, 0) 190deg, var(--halo) 320deg, transparent 360deg);
  filter: blur(11px);
  animation: spin 2.6s linear infinite;
}
.logo {
  position: relative;
  z-index: 1;
  width: 72px;
  height: 72px;
  border-radius: 18px;
  animation: breathe 2.6s ease-in-out infinite;
  box-shadow: var(--logo-shadow);
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.title { font-size: 13.5px; font-weight: 600; letter-spacing: 0.06em; opacity: 0; animation: fade 0.8s ease 0.15s forwards; }
.subtitle { margin-top: 8px; font-size: 11.5px; letter-spacing: 0.08em; color: var(--muted); opacity: 0; animation: fade 0.8s ease 0.32s forwards; }
@keyframes fade { to { opacity: 1; } }
.bar { margin-top: 24px; width: 176px; height: 3px; border-radius: 99px; background: var(--bar-track); overflow: hidden; }
.bar__fill {
  width: 38%;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  animation: slide 1.35s ease-in-out infinite;
}
@keyframes slide { 0% { transform: translateX(-115%); } 100% { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) {
  .halo, .logo, .bar__fill { animation: none; }
  .bar__fill { width: 100%; background: var(--accent); }
}
</style>
</head>
