appId: com.example.gptweb2codexterminal
productName: GPT Web to Codex Terminal

directories:
  buildResources: build
  output: release

# `out/` is produced by electron-vite. `node_modules` is needed because
# `externalizeDepsPlugin` deliberately does NOT bundle runtime dependencies 鈥?# ssh2 and its tree have to be on disk in the packaged app.
files:
  - out/**
  - package.json
  - node_modules/**
  - '!**/*.map'

asar: true
extraResources:
  - from: build/icon.png
    to: tray-icon.png
# ssh2's native accelerators (cpu-features/nan) are OPTIONAL and were never built
# 鈥?npm's allow-scripts gate skips them, and the pure-JS path is what runs. So
# there is nothing to rebuild.
npmRebuild: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development



publish:
  provider: github
  owner: naledao
  repo: gpt-web-to-codex-terminal
