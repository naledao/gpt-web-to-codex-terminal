name: Build and Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $tag = "v$env:VERSION-build.$env:RUN_NUMBER"
          $title = "GPT Web to Codex Terminal v$env:VERSION (build $env:RUN_NUMBER)"
          git tag $tag $env:COMMIT_SHA
          git push origin $tag
          gh release create $tag `
            --title $title `
            --generate-notes `
            "release/GPT Web to Codex Terminal Setup $env:VERSION.exe" `
            "release/GPT Web to Codex Terminal Setup $env:VERSION.exe.blockmap" `
            "release/latest.yml"
